# Render Blueprint for the CareerPilot API (Docker web service, free plan).
# The database is any PostgreSQL (Supabase free tier by default); paste its connection string into DATABASE_URL.
services:
  - type: web
    name: careerpilot-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL # Supabase: use the pooler connection string (IPv4), not the direct db.<ref> host
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY # Fernet key: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_REGISTRATION # closed once the owner account exists
        value: "false"
      - key: CORS_ORIGINS # the frontend origin; requests normally arrive same-origin through the Vercel rewrite
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: GEMINI_API_KEY # optional; Google AI Studio key
        sync: false
      - key: OPENROUTER_API_KEY # optional fallback; free models
        sync: false
      - key: GITHUB_TOKEN # optional; read-only token for higher GitHub rate limits
        sync: false
      - key: WORKER_THREADS
        value: "2"
